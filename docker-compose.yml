services:
  pocket-tts:
    profiles: [pocket-tts]
    build:
      context: .
      dockerfile: docker/pocket-tts.Dockerfile
    container_name: pocket-studio
    ports:
      - "${PORT:-3000}:8000"
    volumes:
      - ./voices:/app/voices
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - VOICES_DIR=${VOICES_DIR:-/app/voices}
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      - OUTPUTS_DIR=${OUTPUTS_DIR:-/app/outputs}
      - MAX_AUDIO_UPLOAD_SIZE_MB=${MAX_AUDIO_UPLOAD_SIZE_MB:-5}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-5000}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  xtts-v2:
    profiles: [xtts-v2]
    build:
      context: .
      dockerfile: docker/xtts-v2.Dockerfile
    container_name: pocket-studio-xtts
    ports:
      - "${PORT:-3000}:8000"
    volumes:
      - ./voices:/app/voices
      - ./outputs:/app/outputs
    environment:
      - VOICES_DIR=${VOICES_DIR:-/app/voices}
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      - OUTPUTS_DIR=${OUTPUTS_DIR:-/app/outputs}
      - HF_HOME=/app/models/hf
      - MAX_AUDIO_UPLOAD_SIZE_MB=${MAX_AUDIO_UPLOAD_SIZE_MB:-5}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-5000}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  qwen3-tts:
    profiles: [qwen3-tts]
    build:
      context: .
      dockerfile: docker/qwen3-tts.Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN:-}
    container_name: pocket-studio
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./voices:/app/voices
      - ./outputs:/app/outputs
    environment:
      - VOICES_DIR=${VOICES_DIR:-/app/voices}
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      - OUTPUTS_DIR=${OUTPUTS_DIR:-/app/outputs}
      - HF_HOME=/app/models
      - HF_HUB_CACHE=/app/models
      - QWEN3_TTS_MODEL=${QWEN3_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      - MAX_AUDIO_UPLOAD_SIZE_MB=${MAX_AUDIO_UPLOAD_SIZE_MB:-5}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-5000}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-4}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
