services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: pocket-studio-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - pocket-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        INSTALL_TTS_DEPS: ${INSTALL_TTS_DEPS:-0}
    container_name: pocket-studio-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./voices:/app/voices
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - API_HOST=${API_HOST:-0.0.0.0}
      - VOICES_DIR=${VOICES_DIR:-/app/voices}
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      - OUTPUTS_DIR=${OUTPUTS_DIR:-/app/outputs}
      - TTS_ENGINE=${TTS_ENGINE:-dummy}
      - HF_HOME=/app/models/hf
      - MAX_AUDIO_UPLOAD_SIZE_MB=${MAX_AUDIO_UPLOAD_SIZE_MB:-5}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-5000}
    networks:
      - pocket-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  pocket-net:
    driver: bridge
