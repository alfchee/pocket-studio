name: CI (Continuous Integration)

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-tts.txt

      - name: Lint Python code
        run: |
          pip install flake8
          flake8 backend --max-line-length=100 --ignore=E501,W503,E402

      - name: Run unit tests
        run: |
          pip install pytest pytest-cov
          python -m pytest backend/tests/ -v --cov=backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build Docker images (pocket-tts profile)
        run: |
          docker compose build pocket-tts

      - name: Build Docker images (xtts-v2 profile)
        run: |
          docker compose build xtts-v2

      - name: Build Docker images (qwen3-tts profile)
        run: |
          docker compose build qwen3-tts

      - name: Health check - pocket-tts
        run: |
          docker compose --profile pocket-tts up -d
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1
          docker compose down

      - name: Health check - xtts-v2
        run: |
          docker compose --profile xtts-v2 up -d
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1
          docker compose down
